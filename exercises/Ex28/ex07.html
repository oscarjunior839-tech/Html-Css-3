<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>propriedade flex-basis em flexbox </title>
     <style>
        .container {
            display: flex;
            flex-flow:row nowrap;
        }
        .item {
            flex:1;
            border: 1px solid #ccc;
            padding: 10px;
            margin: 5px;
            text-align: center;
            flex-basis: 200px;
        }
        div#ia{
          flex-shrink: 1;
          flex-grow: 1;
        }
        div#ib{
            flex-shrink: 1;
          flex-grow: 0;
        }
        div#ic{
        flex-shrink: 1;
          flex-grow: 1;
        }
        div#id{
         flex-shrink: 0;
          flex-grow: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="ia">A</A></div>
        <div class="item" id="ib">B</B></div>
        <div class="item" id="ic">C</div>
        <div class="item" id="id">D</div>
    </div>
        
</body>
</html>
