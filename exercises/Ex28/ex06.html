<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>propriedade flex-basis em flexbox </title>
     <style>
        .container {
            display: flex;
            flex-flow:row wrap;
        }
        .item {
            flex:1;
            border: 1px solid #ccc;
            padding: 10px;
            margin: 5px;
            text-align: center;
            flex-basis: 150px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">conteudo maior</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">conteudo ainda maior</div>
        <div class="item">8</div>
        <div class="item">conteudo ainda maior que proprio maior</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        
</body>
</html>
